services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=itinerarios_db;Username=postgres;Password=postgres"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TouringGo.Usuarios
      Jwt__Audience: TouringGo
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: itinerarios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"